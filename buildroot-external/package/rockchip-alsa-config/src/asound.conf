# ALSA configuration for Rockchip RK3576
# Default PCM device
pcm.!default {
    type hw
    card 0
    device 0
}

# Default control device
ctl.!default {
    type hw
    card 0
}

# ES8388 audio card configuration
pcm.es8388 {
    type hw
    card rockchipes8388
    device 0
}

ctl.es8388 {
    type hw
    card rockchipes8388
}

# HDMI audio configuration
pcm.hdmi {
    type hw
    card rockchiphdmi
    device 0
}

ctl.hdmi {
    type hw
    card rockchiphdmi
}
