name: Report an issue with Muthur Command OS
description: Report an issue related to Muthur Command OS (MCOS).
body:
  - type: markdown
    attributes:
      value: |
        Test with the latest MCOS build before reporting. If you suspect a regression,
        try an older version (for example `mc os update --version x.y` when supported).
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the issue you are experiencing
      description: Provide a clear and concise description of what the bug is.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: dropdown
    validations:
      required: true
    attributes:
      label: What operating system image do you use?
      default: 0
      options:
        - generic-x86-64 (Generic UEFI capable x86-64 systems)
        - generic-aarch64 (Generic UEFI capable aarch64 systems)
        - khadas-vim3 (Khadas VIM3)
        - odroid-c2 (Hardkernel ODROID-C2)
        - odroid-c4 (Hardkernel ODROID-C4)
        - odroid-m1 (Hardkernel ODROID-M1)
        - odroid-m1s (Hardkernel ODROID-M1S)
        - odroid-n2 (Hardkernel ODROID-N2/N2+)
        - ova (for Virtual Machines)
        - rpi3-64 (Raspberry Pi 3 64-bit OS)
        - rpi4-64  (Raspberry Pi 4/400 64-bit OS)
        - rpi5-64  (Raspberry Pi 5 64-bit OS)
        - yellow (Yellow CM4 hub)
        - green (Green)
      description: >
        Board / image id (see `mc os info` or `cat /etc/os-release` on the host).
  - type: input
    validations:
      required: true
    attributes:
      label: What version of Muthur Command OS is installed?
      placeholder: "18.0.dev0"
      description: >
        Full version from `mc os info`, `cat /etc/os-release`, or your release notes.
  - type: dropdown
    validations:
      required: true
    attributes:
      label: Did the problem occur after upgrading the Operating System?
      default: 0
      options:
        - "No"
        - "Yes"
  - type: textarea
    validations:
      required: true
    attributes:
      label: Hardware details
      description: >
        Provide details about the hardware used for your install.
        This is especially important for bare-metal x86 installations.
        If you have any USB devices attached, please list them here.
        For VMs, include the hypervisor type and version.
  - type: textarea
    validations:
      required: true
    attributes:
      label: Steps to reproduce the issue
      description: |
        Please tell us exactly how to reproduce your issue.
        Provide clear and concise step by step instructions and add code snippets if needed.
      value: |
        1.
        2.
        3.
        ...
  - type: textarea
    validations:
      required: true
    attributes:
      label: Anything in the Supervisor logs that might be useful for us?
      description: >
        Use `mc supervisor logs` from the host CLI,
        or copy relevant lines from the Supervisor container logs.
      render: txt
  - type: textarea
    validations:
      required: true
    attributes:
      label: Anything in the Host logs that might be useful for us?
      description: >
        Use `mc host logs` from the host CLI, or `journalctl` on the host as appropriate.
      render: txt
  - type: textarea
    attributes:
      label: System information
      description: >
        **Optional** Paste host diagnostics: output of `mc info`, relevant `journalctl`
        excerpts, or any bundle your project provides for support.
  - type: textarea
    attributes:
      label: Additional information
      description: >
        **Optional** If you have any additional information for us, use the field below.
        Please note, you can attach screenshots or screen recordings here, by
        dragging and dropping files in the field below.
