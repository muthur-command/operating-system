name: Update artifacts index

on:
  # Manual run for specified version
  workflow_dispatch:
    inputs:
      version:
        description: Version of MCOS to build index for
        required: true
        type: string

  # Called by other workflows (e.g. build.yaml)
  workflow_call:
    inputs:
      version:
        description: Version of MCOS to build index for
        required: true
        type: string

# S3-compatible storage for OS artifacts (same pattern as version/.github/workflows/version.yml).
env:
  PYTHON_VERSION: "3.13"
  MCOS_ARTIFACTS_S3_BUCKET: os-artifacts-muthur-command
  MCOS_ARTIFACTS_S3_PUBLIC_BASE: https://s3.muthur-command.com
  MCOS_ARTIFACTS_CDN_BASE: https://os-artifacts.muthur-command.com
  MCOS_S3_NO_VERIFY_SSL: ${{ vars.MCOS_S3_NO_VERIFY_SSL }}

jobs:
  build-index:
    name: Build MCOS artifacts index
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python version ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CLI
        run: pip install awscli

      - name: Create build index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MCOS_S3_NO_VERIFY_SSL: ${{ env.MCOS_S3_NO_VERIFY_SSL }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing AWS credentials. Set Actions secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (S3-compatible keys for MCOS_ARTIFACTS_S3_BUCKET / MCOS_ARTIFACTS_S3_PUBLIC_BASE). See version repo workflow."
            exit 1
          fi
          AWS_SSL=()
          if [ "${MCOS_S3_NO_VERIFY_SSL}" = "true" ]; then
            echo "::warning::MCOS_S3_NO_VERIFY_SSL=true — skipping TLS verify (not for production)."
            AWS_SSL=(--no-verify-ssl)
          fi
          VERSION="${{ inputs.version }}"
          aws "${AWS_SSL[@]}" s3api list-objects-v2 \
            --bucket "${{ env.MCOS_ARTIFACTS_S3_BUCKET }}" \
            --endpoint-url "${{ env.MCOS_ARTIFACTS_S3_PUBLIC_BASE }}" \
            --prefix "${VERSION}/" \
            --query 'Contents[].Key' | jq 'map(split("/")[1]) | sort' > "${VERSION}.json"
          aws "${AWS_SSL[@]}" s3 cp \
            "${VERSION}.json" \
            "s3://${{ env.MCOS_ARTIFACTS_S3_BUCKET }}/indexes/" \
            --endpoint-url "${{ env.MCOS_ARTIFACTS_S3_PUBLIC_BASE }}"

      - name: Regenerate artifacts index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MCOS_S3_NO_VERIFY_SSL: ${{ env.MCOS_S3_NO_VERIFY_SSL }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing AWS credentials."
            exit 1
          fi
          AWS_SSL=()
          if [ "${MCOS_S3_NO_VERIFY_SSL}" = "true" ]; then
            AWS_SSL=(--no-verify-ssl)
          fi
          aws "${AWS_SSL[@]}" s3api list-objects-v2 \
            --bucket "${{ env.MCOS_ARTIFACTS_S3_BUCKET }}" \
            --endpoint-url "${{ env.MCOS_ARTIFACTS_S3_PUBLIC_BASE }}" \
            --prefix "indexes/" \
            --query 'Contents[].Key' | jq 'map(capture("indexes/(?<version>[[:digit:]].+).json").version) | sort' > .os-artifacts/index.json
          aws "${AWS_SSL[@]}" s3 sync \
            .os-artifacts/ \
            "s3://${{ env.MCOS_ARTIFACTS_S3_BUCKET }}/" \
            --endpoint-url "${{ env.MCOS_ARTIFACTS_S3_PUBLIC_BASE }}"

