name: Lock

on:
  schedule:
    - cron: "45 5 * * *"

permissions:
  discussions: write
  issues: write
  pull-requests: write

jobs:
  lock:
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    steps:
      - uses: muthur-command/actions/helpers/lock-issues@mc
        with:
          issue-inactive-days: "30"
          exclude-issue-created-before: "2025-01-01T00:00:00Z"
          pr-inactive-days: "7"
          exclude-pr-created-before: "2025-01-01T00:00:00Z"
