name: "Run command in MCOS build container"
inputs:
  image:
    description: "MCOS builder image to use"
    required: true
  command:
    description: "Command to run in the container"
    required: true
runs:
  using: 'composite'
  steps:
  - name: "Run command in MCOS build container"
    shell: bash
    run: |
      docker run --rm --privileged \
        -e BUILDER_UID="$(id -u)" \
        -e BUILDER_GID="$(id -g)" \
        -e BR2_DL_DIR=/cache/dl \
        -e BR2_CCACHE_DIR=/cache/cc \
        -v "${GITHUB_WORKSPACE}:/build" \
        -v "/mnt/cache:/cache" \
        -v "/mnt/output:/build/output" \
        ${{ inputs.image }} \
        ${{ inputs.command }}
